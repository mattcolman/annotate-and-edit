<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Annotate &amp; Edit — marquee tile</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1400px; height: 560px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(700px 420px at 72% 42%, rgba(79,124,255,.30), transparent 70%),
      radial-gradient(500px 340px at 12% 85%, rgba(79,124,255,.14), transparent 70%),
      linear-gradient(150deg, #1e2230 0%, #12151b 100%);
    color: #e8eaf0;
    display: flex;
    align-items: center;
    padding: 0 96px;
    gap: 60px;
  }

  /* -------- left: brand + copy -------- */
  .left { flex: 0 0 auto; max-width: 600px; }
  .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 26px; }
  .brand img { width: 108px; height: 108px; filter: drop-shadow(0 14px 34px rgba(79,124,255,.5)); }
  .brand h1 { font-size: 58px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.05; }
  .brand h1 .amp { color: #4f7cff; }
  .tag { font-size: 22px; color: #b8c3d9; line-height: 1.45; margin-bottom: 30px; max-width: 480px; }
  .pills { display: flex; gap: 10px; }
  .pill {
    font-size: 15px; font-weight: 600; letter-spacing: .03em;
    color: #c3cbdd; border: 1.5px solid #333947; border-radius: 999px;
    padding: 8px 17px; background: rgba(31,35,43,.7);
  }
  .pill.amber { color: #f5a524; border-color: rgba(245,165,36,.4); }

  /* -------- right: product vignette -------- */
  .right { flex: 1; position: relative; height: 480px; }

  .card {
    position: absolute; border-radius: 14px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 4px 18px rgba(0,0,0,.4);
  }

  /* fake webpage */
  .page {
    width: 520px; height: 400px;
    right: 40px; top: 40px;
    transform: rotate(-3.5deg);
    background: #faf7f2;
  }
  .page .bar {
    height: 34px; background: #2b2f38;
    display: flex; align-items: center; gap: 6px; padding: 0 14px;
  }
  .page .dot { width: 9px; height: 9px; border-radius: 50%; }
  .page .dot.r { background: #ff5f57; } .page .dot.y { background: #febc2e; } .page .dot.g { background: #28c840; }
  .page .body { padding: 30px 34px; position: relative; }
  .page h2 {
    font-family: Georgia, serif; font-size: 30px; font-weight: 700;
    color: #1b1e28; line-height: 1.15; margin-bottom: 14px;
  }
  .page .line { height: 11px; border-radius: 6px; background: #d8d2c6; margin-bottom: 9px; }
  .page .line.w90 { width: 90%; } .page .line.w70 { width: 70%; }
  .page .cta {
    display: inline-block; margin-top: 14px; background: #1b1e28; color: #fff;
    font-size: 13px; font-weight: 600; border-radius: 8px; padding: 9px 16px;
  }

  /* annotation pin */
  .pin {
    position: absolute; width: 26px; height: 26px; border-radius: 50%;
    background: #4f7cff; color: #fff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    left: 22px; top: 24px; border: 2px solid rgba(255,255,255,.5);
    z-index: 3;
  }
  /* edited badge */
  .ebadge {
    position: absolute; background: #f5a524; color: #17191f;
    font-size: 10px; font-weight: 800; letter-spacing: .05em;
    padding: 3px 8px; border-radius: 5px; text-transform: uppercase;
    left: 300px; top: 128px; z-index: 3;
  }

  /* mini toolbar on the page card */
  .mini-tb {
    position: absolute; right: 18px; bottom: 16px; z-index: 3;
    display: flex; align-items: center; gap: 5px;
    background: #17191f; border: 1px solid #2e3340; border-radius: 10px;
    padding: 5px 7px; box-shadow: 0 8px 22px rgba(0,0,0,.35);
  }
  .mini-tb .mlogo { width: 16px; height: 16px; border-radius: 50%; background:
      radial-gradient(circle at 50% 50%, #4f7cff 62%, transparent 63%); }
  .mini-tb .mbtn { height: 18px; border-radius: 5px; background: #1f232b; border: 1px solid #2e3340; }
  .mini-tb .mbtn.b1 { width: 44px; }
  .mini-tb .mbtn.b2 { width: 26px; }
  .mini-tb .mbtn.b3 { width: 38px; background: #4f7cff; border-color: #4f7cff; }

  /* notes panel card behind */
  .panel {
    width: 300px; height: 340px;
    right: -10px; top: -6px;
    transform: rotate(3deg);
    background: #17191f; border: 1px solid #2e3340;
    padding: 18px;
  }
  .panel .ph { font-size: 13px; font-weight: 700; color: #e8eaf0; margin-bottom: 14px; }
  .panel .item {
    background: #1f232b; border: 1px solid #2e3340; border-radius: 8px;
    padding: 10px 12px; margin-bottom: 9px;
  }
  .panel .item .k { font-size: 9px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
  .panel .item .k.a { color: #f5a524; } .panel .item .k.n { color: #4f7cff; }
  .panel .item .t { height: 8px; border-radius: 4px; background: #39404e; margin-bottom: 5px; }
  .panel .item .t.w60 { width: 60%; } .panel .item .t.w85 { width: 85%; }
  .panel .copy {
    margin-top: 14px; background: #4f7cff; border-radius: 8px;
    height: 30px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: #fff;
  }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <img src="../extension/icons/icon128.png" alt="">
      <h1>Annotate <span class="amp">&amp;</span> Edit</h1>
    </div>
    <div class="tag">Pin notes on any website and edit its text live — then copy everything as a prompt for your AI coding agent.</div>
    <div class="pills">
      <span class="pill">Free forever</span>
      <span class="pill">No account</span>
      <span class="pill amber">No data leaves your browser</span>
    </div>
  </div>

  <div class="right">
    <div class="card panel">
      <div class="ph">Annotate &amp; Edit</div>
      <div class="item"><div class="k a">Edit · &lt;h1&gt;</div><div class="t w85"></div><div class="t w60"></div></div>
      <div class="item"><div class="k n">Note</div><div class="t w85"></div><div class="t w60"></div></div>
      <div class="copy">Copy for agent</div>
    </div>
    <div class="card page">
      <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <div class="body">
        <h2>We design websites that win clients</h2>
        <div class="line w90"></div>
        <div class="line w70"></div>
        <div class="cta">Book a free call</div>
      </div>
      <div class="pin">1</div>
      <div class="ebadge">Edited</div>
      <div class="mini-tb"><span class="mlogo"></span><span class="mbtn b1"></span><span class="mbtn b2"></span><span class="mbtn b3"></span></div>
    </div>
  </div>
</body>
</html>
