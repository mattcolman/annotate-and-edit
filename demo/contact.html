<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Acme Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo"><a href="index.html">Acme Studio</a></div>
    <nav>
      <a href="work.html">Work</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Get in touch</h1>
    <p class="lede">
      Tell us about your project and we'll get back to you within a day.
    </p>

    <form onsubmit="return false">
      <label for="name">Your name</label>
      <input id="name" type="text" placeholder="Jane Citizen" />
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="jane@example.com" />
      <label for="msg">What are you building?</label>
      <textarea id="msg" rows="4" placeholder="A website for…"></textarea>
      <br /><br />
      <button class="cta" type="submit">Send message</button>
    </form>
  </main>

  <footer>
    © 2026 Acme Studio · hello@acme-studio.example
  </footer>
</body>
</html>
